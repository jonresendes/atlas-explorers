<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Explorers Globe View</title>
<link rel="stylesheet" href="globe-view.css">
<style>
  html, body { height: 100%; margin: 0; background: #050b18; }
  #globe { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="globe"></div>
<script src="dist/globe-view.js"></script>
<script>
  AtlasGlobe.create(document.getElementById('globe'), {
    basePath: './',
    layer: location.hash === '#lowpoly' ? 'lowpoly' : 'satellite',
    onCountryClick: function (country) {
      // Hook for the game: country is null when the selection is cleared
      console.log('Selected:', country);
    },
    onReady: function (api) { window.atlasGlobe = api; }
  });
</script>
</body>
</html>
